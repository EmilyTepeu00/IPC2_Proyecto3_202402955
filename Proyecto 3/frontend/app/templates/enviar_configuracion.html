<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Configuración</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"] { padding: 10px; border: 2px dashed #ccc; border-radius: 4px; width: 100%; }
        button { 
            padding: 12px 24px; 
            background: #007acc; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #164d77; }
        .back-link { display: inline-block; margin-top: 20px; color: #007acc; text-decoration: none; }
        .resultado { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enviar Mensaje de Configuración</h1>
        <p>Suba un archivo XML con la configuración de recursos, categorías y clientes</p>

        <form id="uploadForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="archivo_xml">Archivo XML:</label>
                <input type="file" id="archivo_xml" name="archivo_xml" accept=".xml" required>
            </div>
            <button type="submit">Subir y Procesar XML</button>
        </form>

        <div id="resultado"></div>

        <a href="{% url 'index' %}" class="back-link">Volver al Inicio</a>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const resultadoDiv = document.getElementById('resultado');
            
            resultadoDiv.innerHTML = '<p>Procesando archivo...</p>';
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.estado === 'exito' || data.estado === 'exito') {
                    resultadoDiv.className = 'resultado exito';
                    let mensaje = `<strong> ${data.mensaje}</strong>`;
                    if (data.resultados) {
                        mensaje += '<ul>';
                        for (const [key, value] of Object.entries(data.resultados)) {
                            if (key !== 'errores' && value > 0) {
                                mensaje += `<li>${key}: ${value}</li>`;
                            }
                        }
                        mensaje += '</ul>';
                    }
                    resultadoDiv.innerHTML = mensaje;
                } else {
                    resultadoDiv.className = 'resultado error';
                    resultadoDiv.innerHTML = `<strong>Error:</strong> ${data.mensaje}`;
                }
            })
            .catch(error => {
                resultadoDiv.className = 'resultado error';
                resultadoDiv.innerHTML = `<strong>Error:</strong> ${error}`;
            });
        });
    </script>
</body>
</html>
