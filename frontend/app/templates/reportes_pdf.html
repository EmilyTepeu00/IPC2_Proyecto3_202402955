<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes PDF</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .report-options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .report-card { background: #f8f9fa; padding: 25px; border-radius: 8px; border: 2px solid #dee2e6; }
        .report-card h3 { margin-top: 0; color: #574d49; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="date"] { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; width: 100%; }
        .btn { 
            padding: 10px 20px; 
            background: #ee7314; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #c25f0f; }
        .back-link { display: inline-block; margin-top: 20px; color: #007acc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reportes en PDF</h1>

        <div class="report-options">
            <!-- REPORTE 1: DETALLE DE FACTURA -->
            <div class="report-card">
                <h3>Detalle de Factura</h3>
                <p>Genere un reporte detallado de una factura especifica con desglose de recursos y tiempos de consumo</p>
                <form>
                    <div class="form-group">
                        <label for="numero_factura">Numero de Factura:</label>
                        <input type="text" id="numero_factura" placeholder="Ej: FAC-001" required>
                    </div>
                    <button type="button" class="btn" onclick="generarReporte('factura')">
                        Generar Reporte de Factura
                    </button>
                </form>
            </div>

            <!-- REPORTE 2: ANALISISI DE VENTAS -->
            <div class="report-card">
                <h3>Analisis de Ventas</h3>
                <p>Analice las categorias, configuraciones y recursos que mas ingresos generan en un periodo especifico</p>
                <form>
                    <div class="form-group">
                        <label for="fecha_inicio_ventas">Fecha Inicio:</label>
                        <input type="date" id="fecha_inicio_ventas" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha_fin_ventas">Fecha Fin:</label>
                        <input type="date" id="fecha_fin_ventas" required>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="radio" name="tipo_analisis" value="categorias" checked> 
                            Categorias y Configuraciones
                        </label>
                        <label>
                            <input type="radio" name="tipo_analisis" value="recursos"> 
                            Recursos
                        </label>
                    </div>
                    <button type="button" class="btn" onclick="generarReporte('ventas')">
                        Generar Analisis de Ventas
                    </button>
                </form>
            </div>
        </div>

        <div id="resultado" style="margin-top: 20px; padding: 15px; border-radius: 4px; display: none;"></div>

        <a href="{% url 'index' %}" class="back-link">Volver al Inicio</a>
    </div>

    <script>
        function generarReporte(tipo) {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.style.display = 'block';
            
            if (tipo === 'factura') {
                resultadoDiv.innerHTML = `
                    <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 4px;">
                        <strong>Reporte de Factura</strong>
                        <p>Esta funcionalidad genera un PDF con:</p>
                        <ul>
                            <li>Datos completos de la factura seleccionada</li>
                            <li>Detalle de montos por cada instancia</li>
                            <li>Tiempos de consumo especificos</li>
                            <li>Desglose de recursos y su aporte al total</li>
                        </ul>
                    </div>
                `;
            } else if (tipo === 'ventas') {
                resultadoDiv.innerHTML = `
                    <div style="background: #cce7ff; color: #004085; padding: 15px; border-radius: 4px;">
                        <strong>Analisis de Ventas</strong>
                        <p>Esta funcionalidad genera un PDF con analisis de:</p>
                        <ul>
                            <li>Categorias y configuraciones mas rentables</li>
                            <li>Recursos que mas ingresos generan</li>
                            <li>Graficos de tendencias de ventas</li>
                            <li>Comparativas por periodos</li>
                        </ul>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
