<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes PDF</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .report-options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .report-card { background: #f8f9fa; padding: 25px; border-radius: 8px; border: 2px solid #dee2e6; }
        .report-card h3 { margin-top: 0; color: #574d49; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="date"], input[type="text"] { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; width: 100%; }
        .btn { 
            padding: 10px 20px; 
            background: #ee7314; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #c25f0f; }
        .back-link { display: inline-block; margin-top: 20px; color: #007acc; text-decoration: none; }
        .resultado { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reportes en PDF</h1>

        <div class="report-options">
            <!-- REPORTE 1: DETALLE DE FACTURA -->
            <div class="report-card">
                <h3>Detalle de Factura</h3>
                <p>Genere un reporte detallado de una factura especifica</p>
                <form id="formFactura">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="numero_factura">Núumero de Factura:</label>
                        <input type="text" id="numero_factura" placeholder="Ej: FAC-20251024-32644-5" required>
                    </div>
                    <button type="button" class="btn" onclick="generarReporteFactura()">
                        Generar Reporte de Factura
                    </button>
                </form>
            </div>

            <!-- REPORTE 2: ANÁLISIS DE VENTAS -->
            <div class="report-card">
                <h3>Análisis de Ventas</h3>
                <p>Analice las categorias y recursos que mas ingresos generan</p>
                <form id="formVentas">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="fecha_inicio_ventas">Fecha Inicio:</label>
                        <input type="date" id="fecha_inicio_ventas" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha_fin_ventas">Fecha Fin:</label>
                        <input type="date" id="fecha_fin_ventas" required>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="radio" name="tipo_analisis" value="categorias" checked> 
                            Categorias y Configuraciones
                        </label>
                        <label>
                            <input type="radio" name="tipo_analisis" value="recursos"> 
                            Recursos
                        </label>
                    </div>
                    <button type="button" class="btn" onclick="generarAnalisisVentas()">
                        Generar Análisis de Ventas
                    </button>
                </form>
            </div>
        </div>

        <div id="resultado" class="resultado"></div>

        <a href="{% url 'index' %}" class="back-link">Volver al Inicio</a>
    </div>

    <script>
        function generarReporteFactura() {
            const numeroFactura = document.getElementById('numero_factura').value;
            const resultadoDiv = document.getElementById('resultado');
            
            if (!numeroFactura) {
                alert('Por favor ingrese el número de factura');
                return;
            }
            
            resultadoDiv.style.display = 'block';
            resultadoDiv.className = 'resultado';
            resultadoDiv.innerHTML = '<p>Generando reporte de factura...</p>';
            
            //Llamar al backend a travez de Django
            fetch("{% url 'proceso_facturacion' %}", {
                method: 'POST',
                body: JSON.stringify({
                    'action': 'generar_pdf',
                    'numero_factura': numeroFactura
                }),
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.estado === 'exito') {
                    resultadoDiv.className = 'resultado exito';
                    resultadoDiv.innerHTML = `
                        <strong>Reporte generado con exito</strong>
                        <p>Archivo: ${data.archivo}</p>
                        <p>El PDF se ha guardado en: backend/data/reportes/</p>
                        <button onclick="descargarPDF('${data.archivo}')" class="btn" style="background: #28a745; margin-top: 10px;">
                            Descargar PDF
                        </button>
                    `;
                } else {
                    resultadoDiv.className = 'resultado error';
                    resultadoDiv.innerHTML = `<strong>Error:</strong> ${data.mensaje}`;
                }
            })
            .catch(error => {
                resultadoDiv.className = 'resultado error';
                resultadoDiv.innerHTML = `<strong>Error:</strong> ${error}`;
            });
        }

        function generarAnalisisVentas() {
            const fechaInicio = document.getElementById('fecha_inicio_ventas').value;
            const fechaFin = document.getElementById('fecha_fin_ventas').value;
            const tipoAnalisis = document.querySelector('input[name="tipo_analisis"]:checked').value;
            const resultadoDiv = document.getElementById('resultado');
            
            if (!fechaInicio || !fechaFin) {
                alert('Por favor seleccione las fechas');
                return;
            }
            
            resultadoDiv.style.display = 'block';
            resultadoDiv.className = 'resultado';
            resultadoDiv.innerHTML = '<p>Generando análisis de ventas...</p>';
            
            resultadoDiv.className = 'resultado exito';
            resultadoDiv.innerHTML = `
                <strong>Análisis de Ventas</strong>
                <p>Esta funcionalidad está en desarrollo.</p>
                <p>Próximamente podrá generar reportes de analisis de ventas por categorias y recursos</p>
            `;
        }

        function descargarPDF(nombreArchivo) {
            //Descargar desde el backend Flask directamente
            const pdfUrl = `http://127.0.0.1:5000/api/reportes/descargar/${nombreArchivo}`;
            window.open(pdfUrl, '_blank');
        }
    </script>
</body>
</html>
